# WinMart category crawl config
# Generated from captured WinMart category API: /mt/api/web/v1/category
# Store profile is intentionally fixed for MVP crawl consistency.

retailer_id: "winmart"
retailer_name: "WinMart"

crawl_profile:
  name: "binh_dinh_default"
  region: "Binh Dinh"
  store_code: "1682"
  store_group_code: "1998"
  branch_name: null
  address_context: "Default Binh Dinh WinMart store for MVP crawl; storeCode provided manually."

crawl_options:
  order: "km"
  page_size: 8
  max_pages_per_category: 50
  stop_after_no_discount_pages: 3
  collect_all_products: false
  stop_on_no_discount_pages: true
  only_discounted_products: true
  hydrate_unmatched_promo_cards: true
  hydrate_detail_pages: true
  max_hydrate_items: 50
  dedupe_keys:
    - "barcode"
    - "sku"
    - "itemNo"
    - "id"

api_templates:
  category_items: "https://api-crownx.winmart.vn/it/api/web/v3/item/category?orderBy=km&orderByDesc=true&pageNumber={page_number}&pageSize={page_size}&slug={slug}&storeCode={store_code}"
