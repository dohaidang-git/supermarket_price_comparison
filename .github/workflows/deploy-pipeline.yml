name: Deploy Pipeline Host

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA or release tag to deploy. Leave blank to deploy this workflow revision.
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: pipeline-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Approved deploy to pipeline host
    runs-on: [self-hosted, supermarket-pipeline]
    environment: pipeline-production
    env:
      DEPLOY_ROOT: ${{ vars.PIPELINE_DEPLOY_ROOT }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      GIT_REF: ${{ inputs.git_ref || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF }}
      - id: revision
        name: Resolve immutable revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate deploy configuration
        run: |
          test -n "$DEPLOY_ROOT"
          test -d "$DEPLOY_ROOT/.git"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy reviewed revision
        run: |
          bash scripts/deploy_pipeline_host.sh \
            --deploy-root "$DEPLOY_ROOT" \
            --git-ref "${{ steps.revision.outputs.sha }}" \
            --airflow-image "ghcr.io/$IMAGE_OWNER/supermarket-airflow:sha-${{ steps.revision.outputs.short_sha }}" \
            --spark-image "ghcr.io/$IMAGE_OWNER/supermarket-spark:sha-${{ steps.revision.outputs.short_sha }}"
